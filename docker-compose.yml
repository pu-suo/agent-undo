# PostgreSQL for development, the quick start and the end-to-end tests.
#   docker compose up -d --wait   start it
#   docker compose down -v        stop it and delete its data
# PG_VERSION selects the major version (default 17); CI runs 15 through 18.
services:
  db:
    image: postgres:${PG_VERSION:-17}
    command:
      - postgres
      - -c
      - wal_level=logical # required for logical decoding
      - -c
      - max_replication_slots=32 # each end-to-end test creates its own slot
      - -c
      - max_wal_senders=32
      - -c
      - max_slot_wal_keep_size=2GB # caps the WAL a stopped recorder's slot can hold
    environment:
      POSTGRES_PASSWORD: postgres # development only
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432" # loopback only
    volumes:
      - ./examples:/examples:ro # the example SQL scripts, for psql in the container
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 2s
      retries: 30
